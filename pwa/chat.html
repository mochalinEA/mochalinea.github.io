<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Видеочат</title>
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Сброс и общие стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }

        /* Основной контейнер (grid-сетка) */
        .app-container {
            display: grid;
            grid-template-rows: 70px 1fr;        /* хедер высотой 70px, остальное — видео */
            grid-template-columns: 260px 1fr;      /* сайдбар 260px, видео — остаток */
            grid-template-areas:
                "header header"
                "sidebar video";
            height: 100vh;
            width: 100%;
        }

        /* ========== ХЕДЕР ========== */
        .header {
            grid-area: header;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #0f3460;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e94560;
            letter-spacing: 1px;
        }

        .header-left .logo i {
            margin-right: 8px;
        }

        .header-left .status {
            font-size: 14px;
            color: #4ecca3;
            background: rgba(78, 204, 163, 0.15);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #4ecca3;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-right .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right .user-profile img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #e94560;
            object-fit: cover;
        }

        .header-right .user-profile span {
            font-weight: 500;
        }

        .header-right .icon-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            padding: 6px;
            border-radius: 50%;
        }

        .header-right .icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* ========== САЙДБАР ========== */
        .sidebar {
            grid-area: sidebar;
            background: #16213e;
            border-right: 1px solid #0f3460;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 8px;
        }

        .sidebar-section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Список контактов */
        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 12px;
            background: transparent;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: #2a3a6e;
        }

        .contact-item.active {
            background: rgba(233, 69, 96, 0.12);
            border-color: #e94560;
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2a3a6e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }

        .contact-avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #4ecca3;
            border-radius: 50%;
            border: 2px solid #16213e;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-last-seen {
            font-size: 12px;
            color: #888;
        }

        .contact-call-btn {
            background: transparent;
            border: none;
            color: #4ecca3;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .contact-call-btn:hover {
            background: rgba(78, 204, 163, 0.15);
            color: #6df0c0;
        }

        /* ========== ВИДЕО-ОБЛАСТЬ ========== */
        .video-area {
            grid-area: video;
            background: #0f0f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Контейнер для видео (remote + local) */
        .video-wrapper {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            position: relative;
        }

        /* Видео собеседника (основное) */
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
            display: block;
        }

        /* Маленькое локальное видео (PiP) */
        #localVideo {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid #2a3a6e;
            background: #1a1a2e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            z-index: 5;
            cursor: grab;
            transition: 0.2s;
        }

        #localVideo:hover {
            border-color: #e94560;
            transform: scale(1.02);
        }

        /* Оверлей, если нет видео (состояние ожидания) */
        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 20px;
            gap: 12px;
            background: #0f0f1f;
            z-index: 1;
            pointer-events: none;
        }

        .video-placeholder i {
            font-size: 56px;
            color: #2a3a6e;
        }

        .video-placeholder span {
            color: #888;
            font-weight: 300;
        }

        /* Элементы управления (кнопки внизу видео) */
        .video-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }

        .video-controls button {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .video-controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .video-controls button.end-call {
            background: #e94560;
            color: #fff;
        }

        .video-controls button.end-call:hover {
            background: #c73652;
            transform: scale(1.05);
        }

        .video-controls button.mic-off {
            color: #e94560;
        }

        .video-controls button.cam-off {
            color: #e94560;
        }

        /* Адаптивность */
        @media (max-width: 820px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: 70px 1fr;
                grid-template-areas:
                    "header"
                    "video";
            }
            .sidebar {
                display: none;
            }
            #localVideo {
                width: 140px;
                height: 100px;
                bottom: 100px;
                right: 16px;
            }
        }

        @media (max-width: 480px) {
            .header-left .status {
                display: none;
            }
            .header-right .user-profile span {
                display: none;
            }
            .video-controls {
                gap: 8px;
                padding: 10px 16px;
            }
            .video-controls button {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            #localVideo {
                width: 100px;
                height: 70px;
                bottom: 90px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ХЕДЕР -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-video"></i> VidChat
                </div>
                <span class="status"><i class="fas fa-circle" style="font-size: 10px; margin-right: 6px; color: #4ecca3;"></i> Онлайн</span>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/100?img=11" alt="avatar" />
                    <span>Алексей</span>
                </div>
                <button class="icon-btn" title="Настройки"><i class="fas fa-cog"></i></button>
                <button class="icon-btn" title="Выход"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <!-- САЙДБАР -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-section-title"><i class="fas fa-users" style="margin-right: 8px;"></i> Контакты</div>
                <ul class="contact-list">
                    <!-- Контакт 1 -->
                    <li class="contact-item active">
                        <div class="contact-avatar" style="background: #2d6a4f;">
                            А
                            <span class="online-dot"></span>
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">Анна</div>
                            <div class="contact-last-seen">онлайн</div>
                        </div>
                        <button class="contact-call-btn"><i class="fas fa-phone"></i></button>
                    </li>
                    <!-- Контакт 2 -->
                    <li class="contact-item">
                        <div class="contact-avatar" style="background: #6a4c9c;">
                            М
                            <span class="online-dot"></span>
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">Михаил</div>
                            <div class="contact-last-seen">онлайн</div>
                        </div>
                        <button class="contact-call-btn"><i class="fas fa-phone"></i></button>
                    </li>
                    <!-- Контакт 3 -->
                    <li class="contact-item">
                        <div class="contact-avatar" style="background: #b9773b;">
                            Е
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">Екатерина</div>
                            <div class="contact-last-seen">была 2 ч. назад</div>
                        </div>
                        <button class="contact-call-btn"><i class="fas fa-phone"></i></button>
                    </li>
                    <!-- Контакт 4 -->
                    <li class="contact-item">
                        <div class="contact-avatar" style="background: #2a6f8f;">
                            Д
                            <span class="online-dot"></span>
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">Дмитрий</div>
                            <div class="contact-last-seen">онлайн</div>
                        </div>
                        <button class="contact-call-btn"><i class="fas fa-phone"></i></button>
                    </li>
                </ul>
            </div>
            <div style="margin-top: auto; border-top: 1px solid #0f3460; padding-top: 16px;">
                <div class="sidebar-section-title"><i class="fas fa-clock" style="margin-right: 8px;"></i> Недавние</div>
                <ul class="contact-list">
                    <li class="contact-item">
                        <div class="contact-avatar" style="background: #8f2a5e;">О</div>
                        <div class="contact-info">
                            <div class="contact-name">Ольга</div>
                            <div class="contact-last-seen">вчера</div>
                        </div>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- ВИДЕО-ОБЛАСТЬ -->
        <main class="video-area">
            <div class="video-wrapper" id="videoWrapper">

                <!-- Видео собеседника (remote) -->
                <video id="remoteVideo" autoplay playsinline muted pip></video>

                <!-- Локальное видео (себя) -->
                <video id="localVideo" autoplay playsinline muted></video>

                <!-- Плейсхолдер, пока нет потока -->
                <div class="video-placeholder" id="placeholder">
                    <i class="fas fa-user-circle"></i>
                    <span>Ожидание подключения...</span>
                </div>

                <!-- Элементы управления -->
                <div class="video-controls">
                    <button id="micBtn" title="Микрофон"><i class="fas fa-microphone"></i></button>
                    <button id="camBtn" title="Камера"><i class="fas fa-video"></i></button>
                    <button id="screenBtn" title="Демонстрация экрана"><i class="fas fa-desktop"></i></button>
                    <button id="endCallBtn" class="end-call" title="Завершить"><i class="fas fa-phone-slash"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // === Элементы DOM ===
            const localVideo = document.getElementById('localVideo');
            const remoteVideo = document.getElementById('remoteVideo');
            const placeholder = document.getElementById('placeholder');

            const micBtn = document.getElementById('micBtn');
            const camBtn = document.getElementById('camBtn');
            const screenBtn = document.getElementById('screenBtn');
            const endCallBtn = document.getElementById('endCallBtn');

            // === Состояние ===
            let localStream = null;
            let remoteStream = null;
            let peerConnection = null;
            let isMicMuted = false;
            let isCamOff = false;

            // === Конфигурация ICE (для примера — публичные STUN-серверы) ===
            const rtcConfig = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            // === 1. Запрашиваем локальные медиа (камера + микрофон) ===
            async function startLocalMedia() {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: true
                    });
                    localVideo.srcObject = localStream;
                    // Скрываем плейсхолдер, если есть локальный поток
                    if (placeholder) placeholder.style.display = 'none';
                    return true;
                } catch (err) {
                    console.error('Ошибка доступа к медиа:', err);
                    alert('Не удалось получить доступ к камере/микрофону. Проверьте разрешения.');
                    return false;
                }
            }

            // === 2. Создаём PeerConnection и добавляем локальный трек ===
            function createPeerConnection() {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }

                peerConnection = new RTCPeerConnection(rtcConfig);

                // Добавляем локальные треки в соединение
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }

                // Обработчик входящих треков (remote)
                peerConnection.ontrack = (event) => {
                    if (!remoteStream) {
                        remoteStream = new MediaStream();
                        remoteVideo.srcObject = remoteStream;
                    }
                    remoteStream.addTrack(event.track);
                };

                // Обработчик ICE-кандидатов (для signalling)
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        // В реальном приложении отправляем кандидата через signalling-сервер
                        console.log('Новый ICE-кандидат:', event.candidate);
                        // Здесь должен быть вызов signalling.sendCandidate(event.candidate)
                    } else {
                        console.log('Все ICE-кандидаты собраны');
                    }
                };

                // Обработчик изменения состояния ICE
                peerConnection.oniceconnectionstatechange = () => {
                    console.log('ICE состояние:', peerConnection.iceConnectionState);
                    if (peerConnection.iceConnectionState === 'connected' ||
                        peerConnection.iceConnectionState === 'completed') {
                        // Соединение установлено
                    }
                    if (peerConnection.iceConnectionState === 'disconnected' ||
                        peerConnection.iceConnectionState === 'failed') {
                        // Попробовать переподключение или завершить
                    }
                };

                return peerConnection;
            }

            // === 3. Имитация signalling: создаём offer (как инициатор) ===
            async function startCall() {
                if (!localStream) {
                    const ok = await startLocalMedia();
                    if (!ok) return;
                }

                // Если уже есть peerConnection — закрываем
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }

                const pc = createPeerConnection();

                try {
                    // Создаём offer
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);

                    // В реальном приложении offer отправляется через signalling-сервер
                    console.log('Offer создан:', pc.localDescription);

                    // === Имитация ответа (для демонстрации — эхо-тест) ===
                    // В реальном приложении здесь вы бы ждали ответ от signalling
                    // и вызывали pc.setRemoteDescription(answer)
                    // Для демонстрации мы не можем получить реальный remote поток,
                    // поэтому покажем фейковый поток или оставим плейсхолдер.
                    // Но мы можем сгенерировать фейковый поток для демонстрации UI:
                    simulateRemoteAnswer(pc);

                } catch (err) {
                    console.error('Ошибка создания offer:', err);
                }
            }

            // === Имитация ответа (для демонстрации работы интерфейса) ===
            function simulateRemoteAnswer(pc) {
                // В реальном приложении вы получаете answer от удалённого пира.
                // Здесь мы просто создаём фейковый MediaStream с цветными полосами,
                // чтобы показать, как выглядит UI с активным видео.

                // Создаём фейковый видеопоток (тестовые полосы)
                const fakeStream = createFakeVideoStream();
                if (fakeStream) {
                    remoteVideo.srcObject = fakeStream;
                    if (placeholder) placeholder.style.display = 'none';
                }

                // Также можно "сэмулировать" ответ для peerConnection, чтобы он перешёл в connected
                // Но для упрощения примера мы просто оставим соединение в состоянии "have-local-offer"
                // и покажем фейковое видео.
                console.log('⚠️ Демонстрационный режим: показано тестовое видео вместо реального удалённого потока.');
            }

            // === Вспомогательная функция: создаёт тестовый видеопоток (полосы) ===
            function createFakeVideoStream() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    const ctx = canvas.getContext('2d');

                    let hue = 0;
                    const draw = () => {
                        hue = (hue + 1) % 360;
                        ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 40px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('Видеочат', canvas.width/2, canvas.height/2 - 20);
                        ctx.font = '20px sans-serif';
                        ctx.fillText('(тестовый поток)', canvas.width/2, canvas.height/2 + 40);
                        requestAnimationFrame(draw);
                    };
                    draw();

                    const stream = canvas.captureStream(30);
                    // Добавляем фейковый аудио-трек (тишина)
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    gain.gain.value = 0;
                    oscillator.connect(gain);
                    gain.connect(audioCtx.destination);
                    oscillator.start();
                    // Создаём MediaStreamAudioDestinationNode для получения аудиопотока
                    const dest = audioCtx.createMediaStreamDestination();
                    gain.connect(dest);
                    const audioTrack = dest.stream.getAudioTracks()[0];
                    if (audioTrack) stream.addTrack(audioTrack);

                    return stream;
                } catch (e) {
                    console.warn('Не удалось создать фейковый поток:', e);
                    return null;
                }
            }

            // === Управление: включить/выключить микрофон ===
            function toggleMic() {
                if (!localStream) return;
                const audioTracks = localStream.getAudioTracks();
                if (audioTracks.length === 0) return;
                const enabled = audioTracks[0].enabled;
                audioTracks[0].enabled = !enabled;
                isMicMuted = !enabled;
                micBtn.innerHTML = isMicMuted ?
                    '<i class="fas fa-microphone-slash"></i>' :
                    '<i class="fas fa-microphone"></i>';
                micBtn.classList.toggle('mic-off', isMicMuted);
            }

            // === Управление: включить/выключить камеру ===
            function toggleCam() {
                if (!localStream) return;
                const videoTracks = localStream.getVideoTracks();
                if (videoTracks.length === 0) return;
                const enabled = videoTracks[0].enabled;
                videoTracks[0].enabled = !enabled;
                isCamOff = !enabled;
                camBtn.innerHTML = isCamOff ?
                    '<i class="fas fa-video-slash"></i>' :
                    '<i class="fas fa-video"></i>';
                camBtn.classList.toggle('cam-off', isCamOff);
                // Если камера выключена — показываем чёрный экран локального видео
                if (isCamOff) {
                    localVideo.style.background = '#111';
                } else {
                    localVideo.style.background = 'transparent';
                }
            }

            // === Демонстрация экрана (screen sharing) ===
            async function toggleScreenShare() {
                try {
                    // Если уже есть screen track — отключаем (простая логика)
                    if (localStream && localStream.getVideoTracks().some(t => t.label.includes('screen'))) {
                        // Возвращаем камеру
                        const camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        // Заменяем треки (упрощённо)
                        const oldVideo = localStream.getVideoTracks()[0];
                        if (oldVideo) {
                            localStream.removeTrack(oldVideo);
                            oldVideo.stop();
                        }
                        const newVideo = camStream.getVideoTracks()[0];
                        localStream.addTrack(newVideo);
                        localVideo.srcObject = localStream;
                        screenBtn.innerHTML = '<i class="fas fa-desktop"></i>';
                        return;
                    }

                    // Запрашиваем экран
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: 1280, height: 720 },
                        audio: false
                    });
                    // Заменяем видео-трек
                    const oldVideo = localStream.getVideoTracks()[0];
                    if (oldVideo) {
                        localStream.removeTrack(oldVideo);
                        oldVideo.stop();
                    }
                    const newScreenTrack = screenStream.getVideoTracks()[0];
                    localStream.addTrack(newScreenTrack);
                    localVideo.srcObject = localStream;
                    screenBtn.innerHTML = '<i class="fas fa-stop"></i>';

                    // При остановке демонстрации (пользователь нажал "Остановить" в браузере)
                    newScreenTrack.onended = () => {
                        // Восстанавливаем камеру
                        navigator.mediaDevices.getUserMedia({ video: true })
                            .then(camStream => {
                                const old = localStream.getVideoTracks()[0];
                                if (old) {
                                    localStream.removeTrack(old);
                                    old.stop();
                                }
                                const newCam = camStream.getVideoTracks()[0];
                                localStream.addTrack(newCam);
                                localVideo.srcObject = localStream;
                                screenBtn.innerHTML = '<i class="fas fa-desktop"></i>';
                            })
                            .catch(err => console.warn('Не удалось восстановить камеру:', err));
                    };

                } catch (err) {
                    console.warn('Демонстрация экрана отменена или недоступна:', err);
                }
            }

            // === Завершить звонок ===
            function endCall() {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                // Останавливаем все треки локального потока
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                // Сбрасываем видео-элементы
                localVideo.srcObject = null;
                remoteVideo.srcObject = null;
                if (placeholder) placeholder.style.display = 'flex';
                // Сброс UI кнопок
                micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                micBtn.classList.remove('mic-off');
                camBtn.innerHTML = '<i class="fas fa-video"></i>';
                camBtn.classList.remove('cam-off');
                screenBtn.innerHTML = '<i class="fas fa-desktop"></i>';
                isMicMuted = false;
                isCamOff = false;
                localVideo.style.background = 'transparent';
                console.log('Звонок завершён');
            }

            // === Обработчики событий ===
            micBtn.addEventListener('click', toggleMic);
            camBtn.addEventListener('click', toggleCam);
            screenBtn.addEventListener('click', toggleScreenShare);
            endCallBtn.addEventListener('click', endCall);

            // === Инициализация: при загрузке страницы запрашиваем локальные медиа ===
            // и сразу "звоним" для демонстрации интерфейса
            (async function init() {
                await startLocalMedia();
                // Запускаем демонстрационный звонок
                startCall();

                // Обработка клика по контакту — имитация вызова
                document.querySelectorAll('.contact-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        // Если клик по кнопке вызова — не обрабатываем дважды
                        if (e.target.closest('.contact-call-btn')) return;
                        const name = this.querySelector('.contact-name')?.textContent || 'Контакт';
                        console.log(`Вызов ${name}...`);
                        // В реальном приложении здесь инициируется звонок через signalling
                        // Для демо — перезапускаем звонок
                        endCall();
                        setTimeout(() => {
                            startLocalMedia().then(() => startCall());
                        }, 300);
                    });
                });

                // Обработка кнопки вызова на контакте
                document.querySelectorAll('.contact-call-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const contact = this.closest('.contact-item');
                        const name = contact?.querySelector('.contact-name')?.textContent || 'Контакт';
                        console.log(`📞 Вызов ${name} через кнопку`);
                        endCall();
                        setTimeout(() => {
                            startLocalMedia().then(() => startCall());
                        }, 300);
                    });
                });
            })();

            // pipButton test
            const PipButton = document.createElement('button')
            PipButton.setAttribute('style', 'position: absolute; top: 20px; left: 20px; padding: 20px;')
            PipButton.classList.add('pipButton')
            PipButton.innerText = 'PiP button'
            PipButton.addEventListener('click', () => {
                try {
                    if (document.pictureInPictureElement) {
                        document.exitPictureInPicture()
                        console.log('exit PiP')
                    } else {
                        remoteVideo.requestPictureInPicture()
                        console.log('enter PiP')
                    }
                } catch (err) {
                    console.log('unluck:', err)
                }
            })

            const Wrapper = document.getElementById('videoWrapper')
            Wrapper.append(PipButton)


        })();
    </script>

</body>
